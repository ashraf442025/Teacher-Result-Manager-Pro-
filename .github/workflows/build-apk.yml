name: Build Teacher Result Manager Pro APK

on:
  workflow_dispatch:

jobs:

  build:

    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. JAVA 17
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ======================================================
      # 3. PYTHON 3.11
      # ======================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ======================================================
      # 4. CHECK PROJECT
      # ======================================================

      - name: Check project files
        run: |
          echo "=========================================="
          echo "PROJECT CHECK"
          echo "=========================================="

          pwd
          echo ""

          ls -la
          echo ""

          test -f main.py
          test -f buildozer.spec

          echo ""
          echo "main.py ............... OK"
          echo "buildozer.spec ....... OK"

      # ======================================================
      # 5. SYSTEM PACKAGES
      # ======================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            gettext \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            pkg-config \
            zlib1g-dev \
            build-essential

      # ======================================================
      # 6. PYTHON BUILD TOOLS
      # ======================================================

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython<3.1" \
            buildozer

      # ======================================================
      # 7. SHOW VERSIONS
      # ======================================================

      - name: Show versions
        run: |
          echo "=========================================="
          echo "VERSIONS"
          echo "=========================================="

          python --version
          pip --version
          cython --version
          buildozer --version

          echo ""
          java -version

      # ======================================================
      # 8. CLEAN OLD BUILD
      # ======================================================

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # ======================================================
      # 9. PREPARE BUILD
      # ======================================================

      - name: Prepare Buildozer
        run: |
          buildozer android clean || true

      # ======================================================
      # 10. ACCEPT ANDROID SDK LICENSES
      # ======================================================

      - name: Accept Android SDK licenses
        run: |

          echo "=========================================="
          echo "ACCEPTING ANDROID SDK LICENSES"
          echo "=========================================="

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

          if [ -x "$SDK/cmdline-tools/bin/sdkmanager" ]; then
            yes | "$SDK/cmdline-tools/bin/sdkmanager" --licenses || true
          fi

          if [ -x "$SDK/tools/bin/sdkmanager" ]; then
            yes | "$SDK/tools/bin/sdkmanager" --licenses || true
          fi

          echo "SDK license step completed."

      # ======================================================
      # 11. BUILD APK
      # ======================================================

      - name: Build APK
        env:
          PIP_NO_INPUT: "1"
        run: |

          echo "=========================================="
          echo "BUILDING TEACHER RESULT MANAGER PRO"
          echo "=========================================="

          yes | buildozer -v android debug

      # ======================================================
      # 12. CHECK APK
      # ======================================================

      - name: Check generated APK
        if: always()
        run: |

          echo "=========================================="
          echo "APK SEARCH"
          echo "=========================================="

          echo ""
          echo "BIN:"
          ls -lah bin || true

          echo ""
          echo "ALL APK FILES:"
          find . -type f -name "*.apk" -print || true

      # ======================================================
      # 13. UPLOAD APK
      # ======================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
