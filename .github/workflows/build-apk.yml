name: Build Teacher Result Manager Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # JAVA 17
      # --------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle


      # --------------------------------------------------------
      # PYTHON 3.11
      # --------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip


      # --------------------------------------------------------
      # SYSTEM DEPENDENCIES
      # --------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            build-essential \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            gettext \
            ccache


      # --------------------------------------------------------
      # PYTHON BUILD TOOLS
      # --------------------------------------------------------
      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install --upgrade cython==0.29.37


      # --------------------------------------------------------
      # BUILDOZER
      # --------------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade buildozer


      # --------------------------------------------------------
      # VERIFY FILES
      # --------------------------------------------------------
      - name: Verify project files
        run: |
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          pwd

          echo "--- Root directory ---"
          ls -la

          echo "--- main.py ---"
          test -f main.py

          echo "--- buildozer.spec ---"
          test -f buildozer.spec

          echo "--- main.py size ---"
          wc -c main.py

          echo "--- buildozer.spec size ---"
          wc -c buildozer.spec


      # --------------------------------------------------------
      # SHOW BUILDOZER VERSION
      # --------------------------------------------------------
      - name: Check Buildozer
        run: |
          buildozer --version


      # --------------------------------------------------------
      # CLEAN OLD BUILDS
      # --------------------------------------------------------
      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------------------------------
      # BUILD APK
      # --------------------------------------------------------
      - name: Build Debug APK
        run: |
          buildozer -v android debug


      # --------------------------------------------------------
      # CHECK APK
      # --------------------------------------------------------
      - name: Check APK output
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          ls -lah bin/

          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"


      # --------------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
