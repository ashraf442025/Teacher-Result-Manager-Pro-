name: Build Teacher Result Manager Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Teacher Result Manager Pro
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. JAVA 17
      # ==========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # 3. PYTHON 3.11
      # ==========================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ==========================================================
      # 4. SYSTEM PACKAGES
      # ==========================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            gettext \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            pkg-config \
            zlib1g-dev \
            build-essential

      # ==========================================================
      # 5. PYTHON BUILD TOOLS
      # ==========================================================

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython<3.1" \
            buildozer

      # ==========================================================
      # 6. CHECK PROJECT FILES
      # ==========================================================

      - name: Check project files
        run: |
          echo "=========================================="
          echo "PROJECT CHECK"
          echo "=========================================="

          pwd
          echo ""

          ls -la
          echo ""

          test -f main.py
          test -f buildozer.spec

          echo ""
          echo "main.py ............... OK"
          echo "buildozer.spec ....... OK"

      # ==========================================================
      # 7. INSTALL ANDROID COMMAND LINE TOOLS
      # ==========================================================

      - name: Install Android SDK Command Line Tools
        run: |

          echo "=========================================="
          echo "ANDROID SDK SETUP"
          echo "=========================================="

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O commandlinetools.zip

          unzip -q commandlinetools.zip \
            -d "$SDK/cmdline-tools"

          mv "$SDK/cmdline-tools/cmdline-tools" \
             "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$SDK"
          echo "SDK setup completed."

      # ==========================================================
      # 8. ACCEPT SDK LICENSES
      # ==========================================================

      - name: Accept Android SDK licenses
        run: |

          echo "=========================================="
          echo "ACCEPTING ANDROID SDK LICENSES"
          echo "=========================================="

          yes | sdkmanager --licenses || true

          echo "SDK licenses accepted."

      # ==========================================================
      # 9. INSTALL ANDROID SDK COMPONENTS
      # ==========================================================

      - name: Install Android SDK packages
        run: |

          echo "=========================================="
          echo "INSTALLING ANDROID SDK COMPONENTS"
          echo "=========================================="

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK packages installed."

      # ==========================================================
      # 10. INSTALL ANDROID NDK 28c
      # ==========================================================

      - name: Install Android NDK 28c
        run: |

          echo "=========================================="
          echo "INSTALLING NDK 28c"
          echo "=========================================="

          sdkmanager "ndk;28.2.13676358"

          echo "NDK 28c installed."

      # ==========================================================
      # 11. VERIFY ANDROID TOOLCHAIN
      # ==========================================================

      - name: Verify Android environment
        run: |

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "SDKMANAGER:"
          sdkmanager --version

          echo ""
          echo "ADB:"
          adb version

          echo ""
          echo "AIDL:"
          find "$ANDROID_HOME/build-tools" \
            -name aidl \
            -type f \
            -print

          echo ""
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk" || true

      # ==========================================================
      # 12. PREPARE BUILD DIRECTORY
      # ==========================================================

      - name: Prepare build directory
        run: |
          rm -rf bin
          mkdir -p bin

      # ==========================================================
      # 13. BUILD APK
      # ==========================================================

      - name: Build APK
        env:
          PIP_NO_INPUT: "1"
        run: |

          echo "=========================================="
          echo "BUILDING TEACHER RESULT MANAGER PRO"
          echo "=========================================="

          buildozer -v android debug

      # ==========================================================
      # 14. FIND APK
      # ==========================================================

      - name: Find generated APK
        if: always()
        run: |

          echo "=========================================="
          echo "GENERATED APK FILES"
          echo "=========================================="

          echo ""
          echo "BIN DIRECTORY:"
          ls -lah bin || true

          echo ""
          echo "SEARCHING FOR APK:"
          find . \
            -type f \
            -name "*.apk" \
            -print

      # ==========================================================
      # 15. UPLOAD APK
      # ==========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
