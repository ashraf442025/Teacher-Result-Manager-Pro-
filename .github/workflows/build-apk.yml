name: Build Teacher Result Manager Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ---------------------------------------------------------
      # 3. Install system packages
      # ---------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev


      # ---------------------------------------------------------
      # 4. Upgrade pip
      # ---------------------------------------------------------
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel


      # ---------------------------------------------------------
      # 5. Install Buildozer
      # ---------------------------------------------------------
      - name: Install Buildozer
        run: |
          pip install "cython<3.1"
          pip install buildozer


      # ---------------------------------------------------------
      # 6. Cache Buildozer
      # ---------------------------------------------------------
      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      # ---------------------------------------------------------
      # 7. Check project files
      # ---------------------------------------------------------
      - name: Check project
        run: |
          echo "Project files:"
          ls -la

          echo ""
          echo "Workflow directory:"
          ls -la .github/workflows || true

          echo ""
          echo "Python version:"
          python --version

          echo ""
          echo "Buildozer version:"
          buildozer version


      # ---------------------------------------------------------
      # 8. Build Debug APK
      # ---------------------------------------------------------
      - name: Build APK
        env:
          APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        run: |
          buildozer android debug


      # ---------------------------------------------------------
      # 9. Show generated files
      # ---------------------------------------------------------
      - name: List APK files
        if: always()
        run: |
          echo "Contents of bin:"
          ls -lah bin/ || true

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print || true


      # ---------------------------------------------------------
      # 10. Upload APK
      # ---------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-Pro-APK
          path: bin/*.apk
          if-no-files-found: error


      # ---------------------------------------------------------
      # 11. Upload Buildozer logs if build fails
      # ---------------------------------------------------------
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: |
            .buildozer/android/platform/python-for-android/
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore
