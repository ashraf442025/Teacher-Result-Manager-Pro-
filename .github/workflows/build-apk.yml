name: Build Teacher Result Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            g++ \
            gcc \
            make \
            patch \
            lbzip2 \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip==24.0"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.34"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare Buildozer Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "System Android SDK:"
          echo "$SDK"

          echo "Buildozer Android SDK:"
          echo "$BUILDOZER_SDK"

          # Start from a clean Buildozer Android SDK.
          rm -rf "$BUILDOZER_SDK"

          mkdir -p "$BUILDOZER_SDK"

          # Copy the Android SDK installed by setup-android
          # into the location Buildozer expects.
          cp -a "$SDK/." "$BUILDOZER_SDK/"

          # Buildozer 1.5.0 expects the legacy sdkmanager path.
          mkdir -p "$BUILDOZER_SDK/tools/bin"

          SDKMANAGER=$(find "$BUILDOZER_SDK/cmdline-tools" \
            -path '*/bin/sdkmanager' \
            -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$BUILDOZER_SDK/cmdline-tools" -maxdepth 5 -type f | head -100
            exit 1
          fi

          ln -sf "$SDKMANAGER" \
            "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo "sdkmanager:"
          ls -l "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo "sdkmanager version:"
          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

      - name: Accept Android licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          yes | "$SDK/tools/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Buildozer Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "========================================"
          echo "Buildozer Android SDK"
          echo "========================================"
          echo "$SDK"

          echo ""
          echo "sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "Android API 35:"
          test -f "$SDK/platforms/android-35/android.jar"

          echo ""
          echo "AIDL:"
          test -x "$SDK/build-tools/35.0.0/aidl"
          ls -l "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "NDK:"
          test -d "$SDK/ndk/28.2.13676358"
          ls -ld "$SDK/ndk/28.2.13676358"

          echo ""
          echo "Android SDK verification successful."

      - name: Show build environment
        run: |
          echo "========================================"
          echo "Python"
          echo "========================================"
          python --version

          echo ""
          echo "pip"
          python -m pip --version

          echo ""
          echo "Buildozer"
          buildozer --version

          echo ""
          echo "Cython"
          cython --version

          echo ""
          echo "Java"
          java -version

      - name: Clean previous Buildozer project
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Restore Buildozer Android SDK after project clean
        run: |
          # Buildozer may recreate its directory after the project clean.
          # Ensure the SDK remains available at the expected location.

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$HOME/.buildozer/android/platform"

          if [ ! -d "$BUILDOZER_SDK/build-tools/35.0.0" ]; then
            echo "Restoring Buildozer Android SDK..."

            rm -rf "$BUILDOZER_SDK"
            mkdir -p "$BUILDOZER_SDK"

            cp -a "$SDK/." "$BUILDOZER_SDK/"

            mkdir -p "$BUILDOZER_SDK/tools/bin"

            SDKMANAGER=$(find "$BUILDOZER_SDK/cmdline-tools" \
              -path '*/bin/sdkmanager' \
              -type f | head -n 1)

            if [ -z "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
            fi

            ln -sf "$SDKMANAGER" \
              "$BUILDOZER_SDK/tools/bin/sdkmanager"
          fi

          echo "Buildozer SDK ready:"
          ls -la "$BUILDOZER_SDK/build-tools"

          echo "AIDL:"
          ls -l "$BUILDOZER_SDK/build-tools/35.0.0/aidl"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show generated APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-APK
          path: bin/*.apk
          if-no-files-found: error
