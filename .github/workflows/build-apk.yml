name: Build Teacher Result Manager Pro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ----------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Java 17
      # ----------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------------------------
      # 3. Python 3.11
      # ----------------------------------------------------------
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ----------------------------------------------------------
      # 4. Android SDK
      # ----------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ----------------------------------------------------------
      # 5. Install EXACT SDK packages
      # ----------------------------------------------------------
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eux

          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "SDKMANAGER=${SDKMANAGER}"

          chmod +x "${SDKMANAGER}"

          yes | "${SDKMANAGER}" --licenses || true

          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | "${SDKMANAGER}" --licenses || true

          echo "Installed Build Tools:"
          ls -la "${ANDROID_HOME}/build-tools/"

          echo "Checking AIDL:"
          test -f "${ANDROID_HOME}/build-tools/35.0.0/aidl"
          echo "AIDL OK"

      # ----------------------------------------------------------
      # 6. Install Buildozer
      # ----------------------------------------------------------
      - name: Install Buildozer
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer

      # ----------------------------------------------------------
      # 7. Clean previous build
      # ----------------------------------------------------------
      - name: Clean Buildozer
        shell: bash
        run: |
          buildozer android clean || true

      # ----------------------------------------------------------
      # 8. Build APK
      # ----------------------------------------------------------
      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          set -o pipefail

          yes | sdkmanager --licenses || true

          echo "Final SDK check:"
          ls -la "${ANDROID_HOME}/build-tools/35.0.0"
          "${ANDROID_HOME}/build-tools/35.0.0/aidl" --version || true

          buildozer -v android debug

      # ----------------------------------------------------------
      # 9. Upload APK
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
