[app]

# ================================================================
# APPLICATION
# ================================================================

title = Teacher Result Manager Pro

package.name = teacherresultmanager

package.domain = org.teacherresultmanager

version = 1.0.0


# ================================================================
# SOURCE
# ================================================================

source.dir = .

source.main = main.py

source.include_exts = py,png,jpg,jpeg,kv,atlas,ttf,otf,json,txt,xml


# ================================================================
# REQUIREMENTS
# ================================================================

requirements = python3,kivy,kivymd,pyjnius,reportlab,pillow


# ================================================================
# DISPLAY
# ================================================================

orientation = portrait

fullscreen = 0


# ================================================================
# ANDROID API
# ================================================================

android.api = 35

android.minapi = 24


# ================================================================
# ANDROID NDK
# ================================================================

android.ndk = 28c


# ================================================================
# ARCHITECTURE
# ================================================================

android.archs = arm64-v8a


# ================================================================
# ANDROID PERMISSIONS
# ================================================================

android.permissions = INTERNET


# ================================================================
# ANDROIDX
# ================================================================

android.enable_androidx = True


# ================================================================
# ANDROID BACKUP
# ================================================================

android.allow_backup = True


# ================================================================
# APK / AAB
# ================================================================

android.debug_artifact = apk

android.release_artifact = aab


# ================================================================
# PYTHON-FOR-ANDROID
# ================================================================

p4a.fork = kivy

p4a.branch = develop

p4a.bootstrap = sdl2


# ================================================================
# LOGGING
# ================================================================

log_level = 2
