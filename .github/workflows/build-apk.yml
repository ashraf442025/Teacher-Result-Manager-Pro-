name: Build Bangla Scientific Calculator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install "pip==24.0"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.34"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Fix Buildozer SDK manager path
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "Android SDK: $SDK"

          echo "Finding sdkmanager..."
          find "$SDK/cmdline-tools" -name sdkmanager -type f -print

          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Found sdkmanager: $SDKMANAGER"

          mkdir -p "$SDK/tools/bin"

          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          echo "Testing sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/tools/bin/sdkmanager" --licenses

      - name: Install Android packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "SDK:"
          echo "$SDK"

          echo "SDK manager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo "Android API:"
          test -f "$SDK/platforms/android-35/android.jar"

          echo "AIDL:"
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo "NDK:"
          test -d "$SDK/ndk/28.2.13676358"

          echo "Android SDK verification successful."

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          buildozer --version
          cython --version
          java -version

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bangla-Scientific-Calculator-APK
          path: bin/*.apk
          if-no-files-found: error
