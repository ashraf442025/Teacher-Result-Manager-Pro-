name: Build Teacher Result Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            g++ \
            gcc \
            make \
            patch \
            lbzip2 \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade "pip==24.0"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.34"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Buildozer 1.5.0 expects the legacy SDK path:
      # $ANDROID_SDK_ROOT/tools/bin/sdkmanager
      # setup-android installs it under cmdline-tools.
      - name: Fix Buildozer SDK manager path
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "Android SDK: $SDK"

          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -path '*/bin/sdkmanager' \
            -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found"
            find "$SDK/cmdline-tools" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          mkdir -p "$SDK/tools/bin"

          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          echo "Buildozer-compatible sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

          echo "sdkmanager version:"
          "$SDK/tools/bin/sdkmanager" --version

      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/tools/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "================================"
          echo "Android SDK"
          echo "================================"
          echo "$SDK"

          echo "sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo "================================"
          echo "Build Tools"
          echo "================================"
          ls -la "$SDK/build-tools"

          echo "================================"
          echo "Android API 35"
          echo "================================"
          test -f "$SDK/platforms/android-35/android.jar"

          echo "================================"
          echo "AIDL"
          echo "================================"
          test -x "$SDK/build-tools/35.0.0/aidl"

          echo "================================"
          echo "NDK"
          echo "================================"
          test -d "$SDK/ndk/28.2.13676358"

          echo "Android SDK verification successful."

      - name: Show build environment
        run: |
          echo "Python:"
          python --version

          echo "pip:"
          python -m pip --version

          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version

          echo "Java:"
          java -version

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show generated APK
        run: |
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-APK
          path: bin/*.apk
          if-no-files-found: error
