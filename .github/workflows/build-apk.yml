name: Build Teacher Result Manager Pro APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      # ======================================================
      # 1. Checkout project
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. Java 17
      # ======================================================

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ======================================================
      # 3. Python 3.11
      # ======================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # ======================================================
      # 4. Verify project files
      # ======================================================

      - name: Check project files
        run: |
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          pwd
          echo ""

          ls -la
          echo ""

          echo "Checking main.py..."
          test -f main.py

          echo "Checking buildozer.spec..."
          test -f buildozer.spec

          echo ""
          echo "main.py and buildozer.spec found."
          echo ""

      # ======================================================
      # 5. Install system dependencies
      # ======================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            gettext \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            pkg-config \
            zlib1g-dev \
            build-essential

      # ======================================================
      # 6. Upgrade Python build tools
      # ======================================================

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython<3.1" \
            buildozer

      # ======================================================
      # 7. Show versions
      # ======================================================

      - name: Show build environment
        run: |
          echo "========================================"
          echo "BUILD ENVIRONMENT"
          echo "========================================"

          python --version
          pip --version
          cython --version
          buildozer --version
          java -version

      # ======================================================
      # 8. Clean old Buildozer output
      # ======================================================

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

      # ======================================================
      # 9. Build APK
      # ======================================================

      - name: Build APK
        env:
          PIP_NO_INPUT: "1"
        run: |
          buildozer -v android debug

      # ======================================================
      # 10. Show generated files
      # ======================================================

      - name: List APK files
        if: always()
        run: |
          echo "========================================"
          echo "BIN DIRECTORY"
          echo "========================================"

          ls -lah bin || true

          echo ""
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print || true

      # ======================================================
      # 11. Upload APK
      # ======================================================

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
