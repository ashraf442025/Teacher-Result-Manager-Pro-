name: Build Teacher Result Manager Pro APK

on:
  workflow_dispatch:

jobs:

  build:

    name: Build APK
    runs-on: ubuntu-22.04

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # JAVA 17
      # =====================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # =====================================================
      # PYTHON 3.11
      # =====================================================

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'


      # =====================================================
      # SYSTEM DEPENDENCIES
      # =====================================================

      - name: Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            wget \
            curl \
            zip \
            unzip \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            gettext \
            libffi-dev \
            libltdl-dev \
            libssl-dev \
            libtool \
            pkg-config \
            zlib1g-dev \
            build-essential


      # =====================================================
      # PYTHON BUILD TOOLS
      # =====================================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            setuptools \
            wheel \
            "Cython<3.1" \
            buildozer


      # =====================================================
      # CHECK PROJECT
      # =====================================================

      - name: Check project files
        run: |

          echo "======================================"
          echo "PROJECT CHECK"
          echo "======================================"

          pwd

          echo ""
          ls -la

          echo ""

          test -f main.py
          test -f buildozer.spec

          echo "main.py ............... OK"
          echo "buildozer.spec ....... OK"


      # =====================================================
      # ANDROID SDK
      # =====================================================

      - name: Install Android SDK
        run: |

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd "$HOME"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O android-tools.zip

          unzip -q android-tools.zip \
            -d "$SDK/cmdline-tools"

          mv \
            "$SDK/cmdline-tools/cmdline-tools" \
            "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"


      # =====================================================
      # SDK LICENSES
      # =====================================================

      - name: Accept Android licenses
        run: |

          yes | sdkmanager --licenses || true


      # =====================================================
      # ANDROID SDK PACKAGES
      # =====================================================

      - name: Install Android packages
        run: |

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"


      # =====================================================
      # VERIFY SDK
      # =====================================================

      - name: Verify Android SDK
        run: |

          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          sdkmanager --version

          echo ""

          find "$ANDROID_HOME/build-tools" \
            -name aidl \
            -type f \
            -print

          echo ""

          ls -la "$ANDROID_HOME/ndk"


      # =====================================================
      # DOWNLOAD REPORTLAB SOURCE
      # =====================================================

      - name: Download ReportLab source
        run: |

          echo "======================================"
          echo "REPORTLAB SOURCE"
          echo "======================================"

          mkdir -p p4a-local-recipes

          cd p4a-local-recipes

          wget -O reportlab.tar.gz \
            https://github.com/eduardocereto/reportlab/archive/refs/heads/master.tar.gz

          tar -xzf reportlab.tar.gz

          mv reportlab-master reportlab

          echo ""
          echo "ReportLab source downloaded."

          ls -la reportlab


      # =====================================================
      # CREATE LOCAL REPORTLAB RECIPE
      # =====================================================

      - name: Create local ReportLab recipe
        run: |

          mkdir -p p4a-local-recipes/reportlab

          cat > p4a-local-recipes/reportlab/__init__.py <<'PYEOF'

          from pythonforandroid.recipe import PythonRecipe


          class ReportLabRecipe(PythonRecipe):

              version = "local"

              url = None

              depends = [
                  "python3",
                  "pillow"
              ]

              site_packages_name = "reportlab"

              def should_build(self, arch):
                  return True


          recipe = ReportLabRecipe()

          PYEOF

          echo "Local ReportLab recipe created."


      # =====================================================
      # SHOW P4A RECIPE
      # =====================================================

      - name: Show local recipe
        run: |

          echo "======================================"
          echo "LOCAL REPORTLAB RECIPE"
          echo "======================================"

          cat p4a-local-recipes/reportlab/__init__.py


      # =====================================================
      # CLEAN BUILD
      # =====================================================

      - name: Clean Buildozer
        run: |

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # =====================================================
      # BUILD APK
      # =====================================================

      - name: Build APK
        env:
          PIP_NO_INPUT: "1"
          PYTHONUNBUFFERED: "1"
        run: |

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          buildozer -v android debug


      # =====================================================
      # SEARCH APK
      # =====================================================

      - name: Find APK
        if: always()
        run: |

          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          echo ""

          ls -lah bin || true

          echo ""

          find . \
            -type f \
            -name "*.apk" \
            -print || true


      # =====================================================
      # UPLOAD APK
      # =====================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
