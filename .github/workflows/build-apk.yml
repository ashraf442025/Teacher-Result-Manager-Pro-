name: Build Teacher Result Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------------
      # Java
      # ------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ------------------------------------------------------------
      # System dependencies
      # ------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            cmake \
            g++ \
            gcc \
            make \
            patch \
            lbzip2 \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libltdl-dev

      # ------------------------------------------------------------
      # Buildozer
      # ------------------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip==24.0"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "cython==0.29.34"

      # ------------------------------------------------------------
      # Android SDK
      # ------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ------------------------------------------------------------
      # Fix Buildozer's legacy sdkmanager path
      # ------------------------------------------------------------
      - name: Fix Buildozer SDK manager path
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "Android SDK:"
          echo "$SDK"

          echo "Searching for sdkmanager..."

          SDKMANAGER=$(find "$SDK/cmdline-tools" \
            -path '*/bin/sdkmanager' \
            -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"

            find "$SDK/cmdline-tools" \
              -maxdepth 5 \
              -type f | head -100

            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          mkdir -p "$SDK/tools/bin"

          ln -sf "$SDKMANAGER" \
            "$SDK/tools/bin/sdkmanager"

          echo "Buildozer-compatible sdkmanager:"
          ls -l "$SDK/tools/bin/sdkmanager"

          echo "sdkmanager version:"
          "$SDK/tools/bin/sdkmanager" --version

      # ------------------------------------------------------------
      # Accept Android licenses
      # ------------------------------------------------------------
      - name: Accept Android licenses
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          yes | "$SDK/tools/bin/sdkmanager" --licenses

      # ------------------------------------------------------------
      # Install Android SDK packages
      # ------------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          "$SDK/tools/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

      # ------------------------------------------------------------
      # Verify Android SDK
      # ------------------------------------------------------------
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"

          echo "========================================"
          echo "Android SDK"
          echo "========================================"
          echo "$SDK"

          echo ""
          echo "sdkmanager:"
          "$SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Build Tools:"
          ls -la "$SDK/build-tools"

          echo ""
          echo "Android API 35:"
          test -f "$SDK/platforms/android-35/android.jar"

          echo ""
          echo "AIDL:"
          test -x "$SDK/build-tools/35.0.0/aidl"
          ls -l "$SDK/build-tools/35.0.0/aidl"

          echo ""
          echo "NDK:"
          test -d "$SDK/ndk/28.2.13676358"
          ls -ld "$SDK/ndk/28.2.13676358"

          echo ""
          echo "Android SDK verification successful."

      # ------------------------------------------------------------
      # Clean Buildozer project
      # ------------------------------------------------------------
      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      # ------------------------------------------------------------
      # Prepare Buildozer Android SDK
      # ------------------------------------------------------------
      - name: Prepare Buildozer Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          BUILDOZER_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Source Android SDK:"
          echo "$SDK"

          echo "Buildozer Android SDK:"
          echo "$BUILDOZER_SDK"

          mkdir -p "$HOME/.buildozer/android/platform"

          rm -rf "$BUILDOZER_SDK"
          mkdir -p "$BUILDOZER_SDK"

          cp -a "$SDK/." "$BUILDOZER_SDK/"

          # Buildozer 1.5.0 expects the legacy sdkmanager path.
          mkdir -p "$BUILDOZER_SDK/tools/bin"

          SDKMANAGER=$(find "$BUILDOZER_SDK/cmdline-tools" \
            -path '*/bin/sdkmanager' \
            -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found in Buildozer SDK"
            exit 1
          fi

          ln -sf "$SDKMANAGER" \
            "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager:"
          ls -l "$BUILDOZER_SDK/tools/bin/sdkmanager"

          echo ""
          echo "Buildozer sdkmanager version:"
          "$BUILDOZER_SDK/tools/bin/sdkmanager" --version

          echo ""
          echo "Build Tools:"
          ls -la "$BUILDOZER_SDK/build-tools"

          echo ""
          echo "AIDL:"
          ls -l "$BUILDOZER_SDK/build-tools/35.0.0/aidl"

      # ------------------------------------------------------------
      # Prepare patched python-for-android
      # ------------------------------------------------------------
      - name: Prepare patched python-for-android
        run: |
          P4A_DIR="$HOME/python-for-android"

          rm -rf "$P4A_DIR"

          git clone \
            --depth 1 \
            https://github.com/kivy/python-for-android.git \
            "$P4A_DIR"

          cd "$P4A_DIR"

          echo "python-for-android commit:"
          git rev-parse HEAD

          echo ""
          echo "Searching for pip upgrade commands..."

          grep -R -n \
            "pip install -U pip" \
            pythonforandroid \
            || true

          echo ""
          echo "Patching pip upgrade..."

          find pythonforandroid \
            -type f \
            -name "*.py" \
            -exec sed -i \
            's/pip install -U pip/pip install -U "pip<26"/g' {} \;

          echo ""
          echo "Verifying patch..."

          if grep -R -n \
            "pip install -U pip" \
            pythonforandroid; then

            echo "ERROR: Old pip upgrade command still exists!"
            exit 1
          fi

          echo ""
          echo "Patched pip commands:"

          grep -R -n \
            'pip install -U "pip<26"' \
            pythonforandroid \
            || true

          echo ""
          echo "p4a patch completed successfully."

      # ------------------------------------------------------------
      # Configure Buildozer environment
      # ------------------------------------------------------------
      - name: Configure Buildozer environment
        run: |
          echo "ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk" >> "$GITHUB_ENV"

          echo "ANDROIDNDK=$HOME/.buildozer/android/platform/android-ndk-r28c" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # Show build environment
      # ------------------------------------------------------------
      - name: Show build environment
        run: |
          echo "========================================"
          echo "Python"
          echo "========================================"
          python --version

          echo ""
          echo "pip"
          python -m pip --version

          echo ""
          echo "Buildozer"
          buildozer --version

          echo ""
          echo "Cython"
          cython --version

          echo ""
          echo "Java"
          java -version

          echo ""
          echo "Android SDK:"
          echo "$ANDROIDSDK"

          echo ""
          echo "Android NDK:"
          echo "$ANDROIDNDK"

          echo ""
          echo "Patched p4a:"
          ls -la "$HOME/python-for-android"

      # ------------------------------------------------------------
      # Build APK
      # ------------------------------------------------------------
      - name: Build APK
        run: |
          buildozer -v android debug

      # ------------------------------------------------------------
      # Show generated APK
      # ------------------------------------------------------------
      - name: Show generated APK
        run: |
          echo "Generated APK files:"
          ls -lah bin/

      # ------------------------------------------------------------
      # Upload APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Result-Manager-APK
          path: bin/*.apk
          if-no-files-found: error
